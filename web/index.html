<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>WASM CHIP-8 Emulator</title>

  <link href="style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap" rel="stylesheet">

  <script type="module" src="index.js"></script>
</head>

<body>

  <h1>WASM CHIP-8 Emulator</h1>

  <p>Rust + WebAssembly CHIP-8 Emulator</p>
  <p>Select a ROM and press START</p>

<div id="emu-container">

    <div id="status">Ready</div>

    <div class="emscripten_border">
        <canvas id="canvas"></canvas>
    </div>

    <div id="menu">


        <a
            href="https://github.com/Jayesh-Dev21/Chip8_emulation"
            target="_blank"
            id="github-link"
        >
            View on GitHub
        </a>

        <br><br>

        <select id="rom-dropdown">

        <option>SELECT ROM</option>

        <option value="TETRIS">TETRIS</option>
        <option value="PONG">PONG</option>
        <option value="15PUZZLE">15PUZZLE</option>
        <option value="BLINKY">BLINKY</option>
        <option value="CONNECT4">CONNECT 4</option>
        <option value="MAZE">MAZE</option>
        <option value="BLITZ">BLITZ</option>
        <option value="BRIX">BRIX</option>
        <option value="HIDDEN">HIDDEN</option>
        <option value="KALEID">KALEID</option>
        <option value="MERLIN">MERLIN</option>
        <option value="MISSILE">MISSILE</option>
        <option value="PONG2">PONG2</option>
        <option value="PUZZLE">PUZZLE</option>
        <option value="SYZYGY">SYZYGY</option>
        <option value="TANK">TANK</option>
        <option value="TICTAC">TICTAC</option>
        <option value="UFO">UFO</option>
        <option value="VBRIX">VBRIX</option>
        <option value="VERS">VERS</option>
        <option value="WIPEOFF">WIPEOFF</option>
        </select>

        <button id="start-stop-button" disabled>
        START
        </button>

    </div>
</div>

    <h4>Controls</h4>


  <div id="keyboard">

    <table class="tg keyboard-element">
      <caption>Keyboard</caption>
      <tr><td>1</td><td>2</td><td>3</td><td>4</td></tr>
      <tr><td>Q</td><td>W</td><td>E</td><td>R</td></tr>
      <tr><td>A</td><td>S</td><td>D</td><td>F</td></tr>
      <tr><td>Z</td><td>X</td><td>C</td><td>V</td></tr>
    </table>

    <span id="arrow">→</span>

    <table class="tg keyboard-element">
      <caption>CHIP-8</caption>
      <tr><td>1</td><td>2</td><td>3</td><td>C</td></tr>
      <tr><td>4</td><td>5</td><td>6</td><td>D</td></tr>
      <tr><td>7</td><td>8</td><td>9</td><td>E</td></tr>
      <tr><td>A</td><td>0</td><td>B</td><td>F</td></tr>
    </table>

  </div>

</body>
</html>
