[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
# Build the core without default features (audio) for wasm targets
chip8_core = { path = "../chip8_core", default-features = false }
js-sys = "0.3.46"
wasm-bindgen = "0.2.69"

[dependencies.web-sys]
version = "0.3.46"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "AudioParam",
    "Window"
]

[lib]
crate-type = ["cdylib"]