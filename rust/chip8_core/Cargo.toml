[package]
name = "chip8_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Make random optional so wasm builds can opt-out of `rand` and avoid `getrandom`
rand = { version = "0.9.0", optional = true }
rodio = { version = "0.20.1", optional = true }

[features]
# `audio` enables audio support (via rodio). Default kept for desktop builds,
# but can be disabled for wasm builds which cannot use rodio.
default = ["audio", "rnd"]
audio = ["rodio"]
# optional feature to enable rand-based random number generation
rnd = ["rand"]
